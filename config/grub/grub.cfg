set default=0
set timeout=5

insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod all_video
insmod video_bochs
insmod video_cirrus
insmod font
insmod gfxterm
insmod png
insmod theme

set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm

set theme=/boot/grub/themes/eclipse-grub-theme/theme.txt

menuentry "Eclipse OS v1.0 Live (Default)" {
    linux /live/vmlinuz boot=live quiet splash components username=eclipse hostname=eclipse-os
    initrd /live/initrd.img
}

menuentry "Eclipse OS v1.0 Direct Disk Installer" {
    linux /live/vmlinuz boot=live components installer username=eclipse hostname=eclipse-os
    initrd /live/initrd.img
}

menuentry "Eclipse OS Safe Graphics (nomodeset)" {
    linux /live/vmlinuz boot=live quiet nomodeset components username=eclipse hostname=eclipse-os
    initrd /live/initrd.img
}
