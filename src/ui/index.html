<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse OS Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="/assets/tailwind.js"></script>
    <script src="/assets/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#0B0D14',
                        surface: '#121520',
                        border: '#1A1D2D',
                        primary: '#8B5CF6',
                        secondary: '#06B6D4',
                        text: '#E2E8F0',
                        muted: '#94A3B8'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0B0D14; color: #E2E8F0; margin: 0; padding: 0; }
        .nav-item.active {
            border-left: 2px solid #8B5CF6;
            background: rgba(139, 92, 246, 0.1);
            color: #E2E8F0;
        }
    </style>
</head>
<body class="antialiased flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-surface border-r border-border flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-border">
            <span class="font-semibold tracking-wide text-sm">ECLIPSE OS</span>
        </div>
        <nav class="flex-1 py-4 flex flex-col gap-1">
            <button onclick="switchTab('installer')" id="nav-installer" class="nav-item active flex items-center gap-3 px-6 py-3 text-sm font-medium text-muted hover:text-text transition-colors text-left">
                <i data-lucide="hard-drive" class="w-4 h-4"></i>
                Disk Installer
            </button>
            <button onclick="switchTab('drivers')" id="nav-drivers" class="nav-item flex items-center gap-3 px-6 py-3 text-sm font-medium text-muted hover:text-text transition-colors text-left">
                <i data-lucide="cpu" class="w-4 h-4"></i>
                Hardware Drivers
            </button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full bg-background overflow-y-auto">
        
        <!-- Installer Tab -->
        <div id="tab-installer" class="p-10 max-w-5xl mx-auto w-full h-full flex flex-col">
            <div class="mb-8 border-b border-border pb-6">
                <h1 class="text-2xl font-semibold mb-2">System Installation</h1>
                <p class="text-muted text-sm">Provision Eclipse OS to a physical storage device. This action will destroy existing data.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 flex-1">
                <!-- Disk Selection -->
                <div class="lg:col-span-2 flex flex-col gap-6">
                    <div>
                        <h2 class="text-sm font-medium text-primary mb-4 uppercase tracking-wider">Target Device</h2>
                        <div id="disk-list" class="flex flex-col gap-3">
                            <div class="animate-pulse bg-surface h-16 rounded-md border border-border"></div>
                        </div>
                    </div>
                </div>

                <!-- Config -->
                <div class="flex flex-col gap-6">
                    <h2 class="text-sm font-medium text-primary mb-1 uppercase tracking-wider">Configuration</h2>
                    
                    <div>
                        <label class="block text-xs font-medium text-muted mb-2">Hostname</label>
                        <input type="text" value="eclipse-os" class="w-full bg-surface border border-border rounded-md px-3 py-2 text-sm focus:outline-none focus:border-primary transition-colors" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-muted mb-2">Admin Username</label>
                        <input type="text" value="eclipse" class="w-full bg-surface border border-border rounded-md px-3 py-2 text-sm focus:outline-none focus:border-primary transition-colors" />
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-muted mb-2">Password</label>
                        <input type="password" placeholder="••••••••" class="w-full bg-surface border border-border rounded-md px-3 py-2 text-sm focus:outline-none focus:border-primary transition-colors" />
                    </div>
                    <div class="mt-4 pt-6 border-t border-border">
                        <button class="w-full bg-primary hover:bg-opacity-90 text-white font-medium py-2.5 rounded-md text-sm transition-colors">
                            Format & Install
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Drivers Tab -->
        <div id="tab-drivers" class="hidden p-10 max-w-5xl mx-auto w-full h-full flex flex-col">
            <div class="mb-8 border-b border-border pb-6">
                <h1 class="text-2xl font-semibold mb-2">Hardware Drivers</h1>
                <p class="text-muted text-sm">Manage proprietary graphics drivers and hardware acceleration modules.</p>
            </div>
            
            <div id="driver-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function switchTab(tabId) {
            document.getElementById('tab-installer').classList.add('hidden');
            document.getElementById('tab-drivers').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            
            document.getElementById('nav-installer').classList.remove('active');
            document.getElementById('nav-drivers').classList.remove('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');

            if(tabId === 'drivers') loadDrivers();
        }

        async function loadDisks() {
            try {
                const res = await fetch('/api/disks');
                const disks = await res.json();
                const list = document.getElementById('disk-list');
                list.innerHTML = '';
                
                disks.forEach((disk, idx) => {
                    list.innerHTML += `
                        <label class="cursor-pointer flex items-center justify-between p-4 bg-surface border border-border rounded-md hover:border-primary transition-colors">
                            <div class="flex items-center gap-4">
                                <input type="radio" name="disk" value="${disk.node}" ${idx===0 ? 'checked' : ''} class="w-4 h-4 text-primary bg-background border-border">
                                <div>
                                    <div class="font-medium text-sm">${disk.node}</div>
                                    <div class="text-xs text-muted mt-1">${disk.model}</div>
                                </div>
                            </div>
                            <div class="text-sm font-mono text-muted">${disk.size}</div>
                        </label>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }

        async function loadDrivers() {
            try {
                const res = await fetch('/api/drivers');
                const drivers = await res.json();
                const list = document.getElementById('driver-list');
                list.innerHTML = '';

                drivers.forEach(drv => {
                    const isActive = drv.status === 'Active';
                    const bgClass = isActive ? 'bg-surface border-primary' : 'bg-surface border-border';
                    const btnClass = isActive ? 'bg-background text-muted cursor-not-allowed border border-border' : 'bg-primary text-white hover:bg-opacity-90';
                    const btnText = isActive ? 'Active' : 'Apply';

                    list.innerHTML += `
                        <div class="p-5 rounded-md border ${bgClass} flex flex-col justify-between gap-4">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <h3 class="font-medium text-sm">${drv.name}</h3>
                                    <span class="text-xs font-mono text-muted">${drv.type}</span>
                                </div>
                                <p class="text-xs text-muted leading-relaxed">${drv.description}</p>
                            </div>
                            <button ${isActive ? 'disabled' : ''} class="w-full py-2 rounded text-xs font-medium transition-colors ${btnClass}">
                                ${btnText}
                            </button>
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }

        loadDisks();
    </script>
</body>
</html>
