<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse OS Hub</title>
    <!-- Premium Variable Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/assets/tailwind.js"></script>
    <script src="/assets/gsap.min.js"></script>
    <script src="/assets/lucide.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        deep: '#050505',
                        glass: 'rgba(255, 255, 255, 0.03)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #fff; overflow-x: hidden; }
        .mesh-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(53, 132, 228, 0.15), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            filter: blur(100px);
        }
        .noise {
            position: fixed; inset: 0; z-index: 50; pointer-events: none;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.04;
        }
        /* Double-Bezel Shell */
        .doppel-shell {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 0.375rem;
            border-radius: 2rem;
        }
        /* Inner Core */
        .doppel-core {
            background: rgba(10,10,10,0.6);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
            border-radius: calc(2rem - 0.375rem);
            padding: 2rem;
            backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-500/30">
    <div class="noise"></div>
    <div class="mesh-bg"></div>

    <!-- Sticky Nav Island -->
    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-40 w-max backdrop-blur-2xl bg-white/5 border border-white/10 rounded-full px-6 py-3 flex items-center gap-8 shadow-2xl">
        <div class="font-bold tracking-widest uppercase text-xs flex items-center gap-2">
            <i data-lucide="moon" class="w-4 h-4 text-blue-400"></i> ECLIPSE
        </div>
        <div class="flex gap-6 text-sm font-medium text-white/60">
            <button onclick="switchTab('installer')" class="hover:text-white transition-colors">Installer</button>
            <button onclick="switchTab('drivers')" class="hover:text-white transition-colors">Drivers</button>
        </div>
    </nav>

    <main class="min-h-[100dvh] pt-32 pb-24 px-4 sm:px-8 max-w-7xl mx-auto flex flex-col items-center">
        <!-- Hero Header -->
        <header class="text-center w-full max-w-4xl mx-auto mb-16 relative">
            <div class="inline-flex items-center rounded-full px-3 py-1 bg-white/5 border border-white/10 text-[10px] uppercase tracking-[0.2em] font-medium text-blue-400 mb-6 stagger-entry">
                System Provisioning
            </div>
            <h1 class="text-5xl md:text-7xl font-semibold tracking-tight leading-[1.1] mb-6 stagger-entry">
                Architect your <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">digital environment.</span>
            </h1>
            <p class="text-lg text-white/40 max-w-xl mx-auto stagger-entry">
                Install the OS persistently or manage hardware drivers with native integrations.
            </p>
        </header>

        <!-- INSTALLER BENTO -->
        <div id="tab-installer" class="w-full grid grid-cols-1 md:grid-cols-12 gap-6 tab-content">
            <!-- Main Disk Select -->
            <div class="col-span-1 md:col-span-8 doppel-shell stagger-entry">
                <div class="doppel-core h-full flex flex-col justify-between relative overflow-hidden">
                    <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div>
                        <h2 class="text-2xl font-medium mb-2">Target Storage</h2>
                        <p class="text-white/40 text-sm mb-8">Select the physical block device to format.</p>
                        <div id="disk-list" class="flex flex-col gap-3">
                            <div class="animate-pulse flex space-x-4">
                                <div class="flex-1 space-y-4 py-1">
                                    <div class="h-4 bg-white/10 rounded w-3/4"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Side Config -->
            <div class="col-span-1 md:col-span-4 doppel-shell stagger-entry">
                <div class="doppel-core h-full flex flex-col gap-6">
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-white/40 mb-2">Hostname</label>
                        <input type="text" value="eclipse-os" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500/50 transition-colors" />
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-white/40 mb-2">Admin User</label>
                        <input type="text" value="eclipse" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500/50 transition-colors" />
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-widest text-white/40 mb-2">Password</label>
                        <input type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500/50 transition-colors" />
                    </div>
                </div>
            </div>

            <!-- Install CTA -->
            <div class="col-span-1 md:col-span-12 flex justify-end mt-4 stagger-entry">
                <!-- Button-in-Button Pattern -->
                <button class="group relative inline-flex items-center gap-4 pl-8 pr-2 py-2 bg-white text-black rounded-full hover:bg-gray-100 transition-all duration-700 ease-[cubic-bezier(0.32,0.72,0,1)] active:scale-[0.98]">
                    <span class="font-medium">Install Eclipse OS</span>
                    <div class="w-10 h-10 rounded-full bg-black/5 flex items-center justify-center transition-transform duration-700 ease-[cubic-bezier(0.32,0.72,0,1)] group-hover:translate-x-1 group-hover:-translate-y-[1px] group-hover:scale-105">
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </div>
                </button>
            </div>
        </div>

        <!-- DRIVERS BENTO -->
        <div id="tab-drivers" class="w-full grid grid-cols-1 md:grid-cols-12 gap-6 tab-content hidden">
            <div class="col-span-1 md:col-span-12 doppel-shell stagger-entry">
                <div class="doppel-core min-h-[400px]">
                    <h2 class="text-2xl font-medium mb-2">Hardware Drivers</h2>
                    <p class="text-white/40 text-sm mb-8">Manage proprietary and open-source graphics drivers.</p>
                    
                    <div id="driver-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();

        // Stagger Entry Animation
        gsap.fromTo('.stagger-entry', 
            { y: 40, opacity: 0, filter: 'blur(10px)' }, 
            { y: 0, opacity: 1, filter: 'blur(0px)', duration: 1.2, stagger: 0.1, ease: 'power4.out' }
        );

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            
            // Re-trigger animation
            gsap.fromTo(`#tab-${tabId} .stagger-entry`, 
                { y: 20, opacity: 0 }, 
                { y: 0, opacity: 1, duration: 0.8, stagger: 0.05, ease: 'power3.out' }
            );

            if(tabId === 'drivers') loadDrivers();
        }

        async function loadDisks() {
            try {
                const res = await fetch('/api/disks');
                const disks = await res.json();
                const list = document.getElementById('disk-list');
                list.innerHTML = '';
                
                disks.forEach((disk, idx) => {
                    list.innerHTML += `
                        <label class="group cursor-pointer relative flex items-center justify-between p-4 rounded-xl border border-white/5 bg-white/5 hover:bg-white/10 transition-colors">
                            <div class="flex items-center gap-4">
                                <input type="radio" name="disk" value="${disk.node}" ${idx===0 ? 'checked' : ''} class="w-4 h-4 text-blue-500 bg-black/50 border-white/20 focus:ring-blue-500/50">
                                <div>
                                    <div class="font-medium text-white">${disk.node}</div>
                                    <div class="text-xs text-white/40">${disk.model}</div>
                                </div>
                            </div>
                            <div class="text-sm font-medium text-white/60">${disk.size}</div>
                        </label>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }

        async function loadDrivers() {
            try {
                const res = await fetch('/api/drivers');
                const drivers = await res.json();
                const list = document.getElementById('driver-list');
                list.innerHTML = '';

                drivers.forEach(drv => {
                    const isActive = drv.status === 'Active';
                    const bgClass = isActive ? 'bg-blue-500/10 border-blue-500/30' : 'bg-white/5 border-white/10';
                    const btnClass = isActive ? 'bg-white/10 text-white/50 cursor-not-allowed' : 'bg-white text-black hover:bg-gray-200';
                    const btnText = isActive ? 'In Use' : 'Install';

                    list.innerHTML += `
                        <div class="p-6 rounded-2xl border ${bgClass} flex flex-col justify-between gap-6 transition-colors">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <h3 class="font-medium text-lg">${drv.name}</h3>
                                    <span class="text-[10px] uppercase tracking-widest px-2 py-1 rounded-full ${isActive ? 'bg-blue-500/20 text-blue-400' : 'bg-white/10 text-white/60'}">${drv.type}</span>
                                </div>
                                <p class="text-sm text-white/40 leading-relaxed">${drv.description}</p>
                            </div>
                            <button ${isActive ? 'disabled' : ''} class="w-max px-6 py-2 rounded-full text-sm font-medium transition-colors ${btnClass}">
                                ${btnText}
                            </button>
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }

        // Initialize
        loadDisks();
    </script>
</body>
</html>
